default_install_hook_types: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: bump-version
        name: Bump patch version on code changes
        entry: python scripts/bump_version.py
        language: system
        pass_filenames: false
        always_run: true
      - id: validate
        name: Full validation (ruff, mypy, pytest)
        entry: python scripts/validate.py
        language: system
        pass_filenames: false
        always_run: true
